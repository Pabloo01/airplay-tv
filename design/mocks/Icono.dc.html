<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Icono y banner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 960px; height: 540px; box-sizing: border-box; padding: 40px 48px; background: #120F22; font-family: Nunito, sans-serif; color: #FFF6EA; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #FFC94A">ICONO Y BANNER</span>
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 32px">Pepe da la cara</h1>
  </div>
  <div style="display: flex; gap: 40px; align-items: flex-start">
    <div style="width: 240px; display: flex; flex-direction: column; gap: 14px">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Icono de AirPlay TV: Pepe sonriendo">
        <rect width="240" height="240" rx="54" fill="#2A2250"></rect>
        <path d="M104 82 L80 36 M136 82 L162 32" stroke="#FFC94A" stroke-width="10" stroke-linecap="round"></path>
        <circle cx="79" cy="33" r="12" fill="#FFC94A"></circle>
        <circle cx="163" cy="29" r="12" fill="#FFC94A"></circle>
        <rect x="38" y="78" width="164" height="132" rx="36" fill="#FF6B5B"></rect>
        <rect x="56" y="96" width="128" height="90" rx="26" fill="#FFF3DE"></rect>
        <ellipse cx="96" cy="134" rx="10" ry="12" fill="#2A1633"></ellipse>
        <ellipse cx="144" cy="134" rx="10" ry="12" fill="#2A1633"></ellipse>
        <circle cx="99.5" cy="129.5" r="3.5" fill="#FFFFFF"></circle>
        <circle cx="147.5" cy="129.5" r="3.5" fill="#FFFFFF"></circle>
        <ellipse cx="76" cy="156" rx="9" ry="6" fill="#FF9E8F"></ellipse>
        <ellipse cx="164" cy="156" rx="9" ry="6" fill="#FF9E8F"></ellipse>
        <path d="M104 158 Q120 174 136 158" stroke="#2A1633" stroke-width="6" fill="none" stroke-linecap="round"></path>
      </svg>
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <svg width="96" height="96" viewBox="0 0 240 240" role="img" aria-label="El icono a 96 píxeles">
          <rect width="240" height="240" rx="54" fill="#2A2250"></rect>
          <path d="M104 82 L80 36 M136 82 L162 32" stroke="#FFC94A" stroke-width="12" stroke-linecap="round"></path>
          <circle cx="79" cy="33" r="13" fill="#FFC94A"></circle>
          <circle cx="163" cy="29" r="13" fill="#FFC94A"></circle>
          <rect x="38" y="78" width="164" height="132" rx="36" fill="#FF6B5B"></rect>
          <rect x="56" y="96" width="128" height="90" rx="26" fill="#FFF3DE"></rect>
          <ellipse cx="96" cy="134" rx="11" ry="13" fill="#2A1633"></ellipse>
          <ellipse cx="144" cy="134" rx="11" ry="13" fill="#2A1633"></ellipse>
          <path d="M104 158 Q120 174 136 158" stroke="#2A1633" stroke-width="8" fill="none" stroke-linecap="round"></path>
        </svg>
        <svg width="48" height="48" viewBox="0 0 240 240" role="img" aria-label="El icono a 48 píxeles">
          <rect width="240" height="240" rx="54" fill="#2A2250"></rect>
          <path d="M104 82 L80 36 M136 82 L162 32" stroke="#FFC94A" stroke-width="16" stroke-linecap="round"></path>
          <rect x="38" y="78" width="164" height="132" rx="36" fill="#FF6B5B"></rect>
          <rect x="56" y="96" width="128" height="90" rx="26" fill="#FFF3DE"></rect>
          <ellipse cx="96" cy="134" rx="13" ry="15" fill="#2A1633"></ellipse>
          <ellipse cx="144" cy="134" rx="13" ry="15" fill="#2A1633"></ellipse>
          <path d="M104 160 Q120 176 136 160" stroke="#2A1633" stroke-width="12" fill="none" stroke-linecap="round"></path>
        </svg>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #C8BFDA">Icono de la app. A 48 px se simplifica: sin brillos ni mejillas.</p>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
      <div style="position: relative; width: 584px; height: 328px; border-radius: 22px; overflow: hidden; background: #16122B">
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #221B3D"></div>
        <div aria-hidden="true" style="position: absolute; left: 330px; top: 40px; width: 7px; height: 7px; border-radius: 4px; background: #FFC94A; opacity: 0.5"></div>
        <div aria-hidden="true" style="position: absolute; left: 520px; top: 90px; width: 5px; height: 5px; border-radius: 3px; background: #FFF6EA; opacity: 0.4"></div>
        <div style="position: absolute; left: 22px; top: 52px">
          <dc-import name="Pepe" mood="palomitas" size="250" hint-size="250px,250px"></dc-import>
        </div>
        <div style="position: absolute; left: 290px; top: 108px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 56px; line-height: 60px">AirPlay TV</span>
          <span style="font-family: Fredoka, sans-serif; font-weight: 500; font-size: 24px; color: #FFC94A">Tu sala de cine en casa</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #C8BFDA">Banner de la fila de apps de Google TV (320 × 180, aquí al doble). Pepe ya con sus gafas 3D: se entiende de un vistazo para qué es.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
