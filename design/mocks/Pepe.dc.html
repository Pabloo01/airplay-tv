<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pepe, la mascota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>

    <g display="{{v.mouthOpen}}">
      <path d="M84 120 Q100 144 116 120 Z" fill="#2A1633"></path>

    </g>
    <ellipse display="{{v.mouthO}}" cx="100" cy="128" rx="6" ry="7" fill="#2A1633"></ellipse>

      <rect x="22" y="90" width="20" height="36" rx="9" fill="#FFC94A" stroke="#2A1633" stroke-width="4"></rect>
      <rect x="158" y="90" width="20" height="36" rx="9" fill="#FFC94A" stroke="#2A1633" stroke-width="4"></rect>

      <circle cx="12" cy="128" r="8" fill="#FFE7A8"></circle>
      <circle cx="23" cy="121" r="9" fill="#FFF0C7"></circle>
      <circle cx="35" cy="124" r="9" fill="#FFE7A8"></circle>
      <circle cx="45" cy="130" r="7" fill="#FFF0C7"></circle>
      <circle cx="28" cy="112" r="7" fill="#FFF0C7"></circle>

      <path d="M16 132 L19 184 M28 132 L28 184 M40 132 L37 184" stroke="#E5484D" stroke-width="5"></path>

    </g>
    <g display="{{v.wave}}">
      <animateTransform attributeName="transform" type="rotate" values="0 166 124; -18 166 124; 0 166 124" dur="1.1s" repeatCount="indefinite"></animateTransform>

      <ellipse cx="16" cy="56" rx="6" ry="4.5" fill="#FF9E8F"></ellipse>
      <path d="M21 55 V34" stroke="#FF9E8F" stroke-width="3.5" stroke-linecap="round"></path>
    </g>
    <g display="{{v.zzz}}" fill="#C8BFDA" font-family="Fredoka, sans-serif" font-weight="600">
      <text x="148" y="46" font-size="20">z</text>
      <text x="164" y="30" font-size="26">Z</text>
      <text x="184" y="14" font-size="16">z</text>
    </g>
    <text display="{{v.question}}" x="152" y="42" font-size="40" font-weight="700" fill="#FFC94A" font-family="Fredoka, sans-serif">?</text>

      <path d="M140 18 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"></path>
      <path d="M100 6 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"></path>
    </g>
    <g display="{{v.magnifier}}">
      <path d="M164 84 L150 102" stroke="#FF6B5B" stroke-width="12" stroke-linecap="round"></path>

      <path d="M169 70 Q176 63 183 70 M172.5 74 Q176 71 179.5 74" stroke="#2A1633" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
    </g>
    <g display="{{v.wrench}}">
      <path d="M166 132 L182 112" stroke="#FF6B5B" stroke-width="12" stroke-linecap="round"></path>
      <path d="M176 116 L190 96" stroke="#B9C1D1" stroke-width="7" stroke-linecap="round"></path>
      <circle cx="192" cy="91" r="9" fill="#B9C1D1"></circle>
      <circle cx="195" cy="87" r="4" fill="#16122B"></circle>

    <g display="{{v.clipboard}}">
      <rect x="158" y="96" width="36" height="46" rx="6" fill="#FFF3DE" stroke="#2A1633" stroke-width="4"></rect>

      <path d="M166 112 H186 M166 121 H186 M166 130 H178" stroke="#2A1633" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="158" cy="132" r="9" fill="#FF6B5B"></circle>
    </g>
  </g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["hola","curioso","palomitas","triste","musica","mareado","dormido","buscando","herramientas","lista"],"default":"hola"},"size":{"editor":"int","default":240,"min":48,"max":480},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'hola';
    const size = Number(this.props.size ?? 240) || 240;
    const on = (list) => (list.indexOf(mood) >= 0 ? 'inline' : 'none');
    const v = {
      antNormal: mood === 'mareado' ? 'none' : 'inline',
      antBent: on(['mareado']),
      eyesOpen: on(['hola', 'curioso', 'palomitas', 'triste', 'musica', 'buscando', 'herramientas', 'lista']),
      eyesClosed: on(['dormido']),
      eyesDizzy: on(['mareado']),
      browsSad: on(['triste']),
      browCurious: on(['curioso', 'buscando']),
      tear: on(['triste']),
      mouthSmile: on(['hola', 'herramientas', 'lista']),
      mouthOpen: on(['palomitas', 'musica']),
      mouthO: on(['curioso', 'buscando', 'mareado']),
      mouthSad: on(['triste']),
      mouthSleep: on(['dormido']),
      glasses: on(['palomitas']),
      popcorn: on(['palomitas']),
      wave: on(['hola']),
      headphones: on(['musica']),
      notes: on(['musica']),
      zzz: on(['dormido']),
      question: on(['curioso']),
      stars: on(['mareado']),
      magnifier: on(['buscando']),
      wrench: on(['herramientas']),
      clipboard: on(['lista']),
    };
    const motions = {
      dormido: { values: '0 0; 0 -3; 0 0', dur: '4s' },
      mareado: { values: '-3 0; 3 0; -3 0', dur: '1.6s' },
      musica: { values: '0 0; 0 -9; 0 0', dur: '0.7s' },
      palomitas: { values: '0 0; 0 -2; 0 0', dur: '3s' },
    };
    const labels = {
      hola: 'Pepe saluda', curioso: 'Pepe, curioso', palomitas: 'Pepe con gafas 3D y palomitas',
      triste: 'Pepe, triste', musica: 'Pepe con cascos', mareado: 'Pepe, mareado',
      dormido: 'Pepe, dormido', buscando: 'Pepe buscando Wi-Fi con una lupa',
      herramientas: 'Pepe con una llave inglesa', lista: 'Pepe con su lista',
    };
    return {
      px: size + 'px',
      v,
      motion: motions[mood] || { values: '0 0; 0 -5; 0 0', dur: '2.4s' },
      label: labels[mood] || 'Pepe',
    };
  }
}
</script>
</body>
</html>
